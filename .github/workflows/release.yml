name: Build & Release (macOS)

# Builds the macOS DMGs (arm64 + x64) on a macOS GitHub runner and
# attaches them to a Release. The in-app updater (src/update-check.js)
# polls this repo's Releases feed, so a new tag is all that's needed
# to ship an update to every existing ScanVerse install.
#
# Trigger:
#   - push a tag matching v* (e.g. `git tag v0.2.15 && git push --tags`)
#   - or run manually from the Actions UI (workflow_dispatch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# action-gh-release needs write access to create/update the Release and
# upload the .dmg assets.
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build DMGs (arm64 + x64)
        # CSC_IDENTITY_AUTO_DISCOVERY=false tells electron-builder not to
        # look for a Developer ID certificate in the runner's keychain.
        # Combined with mac.identity:"-" in package.json, the build is
        # ad-hoc signed — Apple Silicon (M1+) refuses to launch *anything*
        # without a code signature, even a self-generated one. The
        # ad-hoc signature gets us past that gate; users still see the
        # untrusted-developer prompt on first launch (no notarization),
        # but it's the soft "Open anyway in Privacy & Security" flow
        # rather than the fatal "app is damaged" error v0.2.14 hit on
        # Apple Silicon.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # GH_TOKEN unset on purpose — we don't want electron-builder's
          # built-in publishing path; the action-gh-release step below
          # handles the upload so we control exactly which files land on
          # the Release.
        run: npm run build:mac

      - name: Verify ad-hoc signature on built .app
        # If electron-builder ever silently regressed to unsigned (it has
        # in past releases when an identity flag changed name), `codesign
        # --verify` would fail here and the workflow would surface the
        # issue *before* shipping a broken DMG to users.
        run: |
          set -e
          for app in dist/mac*/ScanVerse.app; do
            if [ -d "$app" ]; then
              echo "Verifying: $app"
              codesign --verify --deep --strict --verbose=2 "$app"
              codesign -dvv "$app" 2>&1 | head -10
            fi
          done

      - name: List build artefacts
        # Quick sanity dump in the logs so we can spot if a target
        # silently dropped (e.g. wrong arch name).
        run: ls -lh dist/

      - name: Upload artefacts (CI archive)
        uses: actions/upload-artifact@v4
        with:
          name: ScanVerse-macOS-${{ github.ref_name }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Don't overwrite an existing Release body if a maintainer has
          # already written one before the workflow finished (they can
          # tag first, write notes in the Release UI while CI builds).
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*.dmg
